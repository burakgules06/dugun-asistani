services:
  db:
    image: postgres:16
    container_name: dugun-db
    environment:
      POSTGRES_DB: dugun
      POSTGRES_USER: dugun_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_sifre_123}
    ports:
      - "5432:5432"
    volumes:
      - dugun_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dugun_app -d dugun"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dugun_pgdata:
